<body class="bg-[#d1d7db] font-sans antialiased text-[#111b21] h-screen overflow-hidden flex flex-col justify-center items-center">
  <div id="root" class="w-full h-full max-w-[1720px] flex shadow-2xl relative"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const QUICK_EMOJIS = ["😀", "😂", "❤️", "👍", "🔥", "🚀", "🎉", "💯", "🙏", "✨", "👏", "🙌", "😍", "🥳"];
    const REACTION_BAR_EMOJIS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (_) {}
    }

    function WhatsAppApp() {
      const [socket, setSocket] = useState(null);
      const [token, setToken] = useState(() => localStorage.getItem("wa_token") || "");
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("wa_user");
        return saved
          ? JSON.parse(saved)
          : {
              username: "bhavya",
              displayName: "Bhavya",
              email: "bhavya@whatsapp.local",
              avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&h=120&q=80",
              about: "Coding WebSockets in Sem 3",
              phone: "+91 98111 22233",
            };
      });

      // Modals
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [isNewChatModalOpen, setIsNewChatModalOpen] = useState(false);
      const [isNewGroupModalOpen, setIsNewGroupModalOpen] = useState(false);
      const [isGroupInfoModalOpen, setIsGroupInfoModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [selectedMessageForAction, setSelectedMessageForAction] = useState(null);
      const [isMobileChatOpen, setIsMobileChatOpen] = useState(false);

      // State
      const [activeRoomId, setActiveRoomId] = useState("general");
      const [rooms, setRooms] = useState([]);
      const [messages, setMessages] = useState([]);
      const [registeredUsers, setRegisteredUsers] = useState([]);
      const [onlineUsers, setOnlineUsers] = useState([]);
      const [inputText, setInputText] = useState("");
      const [typingUser, setTypingUser] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [activeTab, setActiveTab] = useState("all");
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [replyingTo, setReplyingTo] = useState(null);
      const [announcementBanner, setAnnouncementBanner] = useState("");
      const [smartSuggestions, setSmartSuggestions] = useState(["Sounds good!", "All tests are green! ✓", "Let's discuss."]);
      const [aiSummaryModal, setAiSummaryModal] = useState(null);

      // Voice note recording
      const [isRecordingVoice, setIsRecordingVoice] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const recordTimerRef = useRef(null);

      // WebRTC Calling
      const [callModal, setCallModal] = useState(null);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const localStreamRef = useRef(null);
      const peerConnectionRef = useRef(null);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);

      const messagesEndRef = useRef(null);
      const typingTimeoutRef = useRef(null);
      const fileInputRef = useRef(null);
      const activeRoomIdRef = useRef(activeRoomId);

      useEffect(() => {
        activeRoomIdRef.current = activeRoomId;
      }, [activeRoomId]);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, typingUser, activeRoomId]);

      // Resilient auto-authentication for default demo user
      useEffect(() => {
        if (!token) {
          fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier: "bhavya", password: "Password123!" }),
          })
            .then((res) => res.json())
            .then((result) => {
              if (result.success && result.data) {
                const u = result.data.user;
                const t = result.data.tokens.accessToken;
                setCurrentUser(u);
                setToken(t);
                localStorage.setItem("wa_user", JSON.stringify(u));
                localStorage.setItem("wa_token", t);
              }
            })
            .catch(() => {});
        }
      }, [token]);

      const loadConversations = () => {
        fetch("/api/rooms")
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data)) setRooms(data);
          })
          .catch(() => {});
      };

      const loadUsers = () => {
        fetch("/api/users")
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data)) setRegisteredUsers(data);
          })
          .catch(() => {});
      };

      useEffect(() => {
        loadConversations();
        loadUsers();

        const s = io({
          transports: ["websocket", "polling"],
          auth: { token },
        });

        setSocket(s);

        // ---- Starter Code Compatibility ----
        s.emit("kuchbhi", "welcome to client side");

        s.on("gyankibaat", (msg) => {
          console.log("[Starter Event - gyankibaat]:", msg);
        });

        s.on("join", (msg) => {
          console.log("[Starter Event - join]:", msg);
        });

        s.on("announcement", (msg) => {
          console.log("[Starter Event - announcement]:", msg);
          setAnnouncementBanner(msg);
          setTimeout(() => setAnnouncementBanner(""), 5000);
        });

        // ---- WhatsApp Protocol Events ----
        s.emit("user:join", currentUser);

        s.on("user:joined", (data) => {
          if (data.rooms) setRooms(data.rooms);
          if (data.history) setMessages(data.history);
        });

        s.on("room:history", (data) => {
          if (data.roomId === activeRoomIdRef.current) {
            setMessages(data.messages);
          }
        });

        s.on("message:receive", (msg) => {
          if (msg.roomId === activeRoomIdRef.current || !msg.roomId) {
            setMessages((prev) => {
              if (prev.some((m) => m.id === msg.id || m._id === msg._id)) return prev;
              return [...prev, msg];
            });
          }

          if (msg.sender?.id !== currentUser.id && msg.sender?.userId !== currentUser._id) {
            playNotificationSound();
          }

          s.emit("message:read", { messageId: msg.id || msg._id, roomId: activeRoomIdRef.current });

          // Update smart reply suggestions
          if (msg.text) {
            fetch(`/api/ai/suggestions?messageText=${encodeURIComponent(msg.text)}`)
              .then((r) => r.json())
              .then((res) => {
                if (res.success && res.data) setSmartSuggestions(res.data);
              })
              .catch(() => {});
          }
        });

        s.on("users:update", (usersList) => {
          setOnlineUsers(usersList);
          loadUsers();
        });

        s.on("typing:start", ({ username, roomId }) => {
          if (roomId === activeRoomId) setTypingUser(username);
        });

        s.on("typing:stop", ({ roomId }) => {
          if (roomId === activeRoomId) setTypingUser(null);
        });

        s.on("message:status_updated", ({ messageId, status }) => {
          setMessages((prev) =>
            prev.map((m) => (m.id === messageId || m._id === messageId ? { ...m, status } : m))
          );
        });

        s.on("message:reacted", ({ messageId, reactions }) => {
          setMessages((prev) =>
            prev.map((m) => (m.id === messageId || m._id === messageId ? { ...m, reactions } : m))
          );
        });

        s.on("message:deleted", ({ messageId }) => {
          setMessages((prev) =>
            prev.map((m) =>
              m.id === messageId || m._id === messageId
                ? { ...m, text: "This message was deleted", isDeletedForEveryone: true, mediaUrl: null }
                : m
            )
          );
        });

        // WebRTC Signaling
        s.on("call:incoming", (data) => {
          setCallModal({
            type: data.isVideo ? "video" : "voice",
            status: "incoming",
            caller: data.caller,
            offer: data.offer,
            roomId: data.roomId,
          });
        });

        s.on("call:answered", async (data) => {
          if (peerConnectionRef.current && data.answer) {
            await peerConnectionRef.current.setRemoteDescription(new RTCSessionDescription(data.answer));
            setCallModal((prev) => (prev ? { ...prev, status: "connected" } : null));
          }
        });

        s.on("call:ice_candidate", async (data) => {
          if (peerConnectionRef.current && data.candidate) {
            try {
              await peerConnectionRef.current.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (_) {}
          }
        });

        s.on("call:ended", () => {
          endCall(false);
        });

        return () => {
          s.disconnect();
        };
      }, [currentUser.id, token, activeRoomId]);

      const handleSwitchRoom = (roomId) => {
        setActiveRoomId(roomId);
        activeRoomIdRef.current = roomId;
        setIsMobileChatOpen(true);
        setTypingUser(null);
        setReplyingTo(null);
        setMessages([]);
        fetch(`/api/messages/${roomId}`)
          .then((r) => r.json())
          .then((res) => {
            if (Array.isArray(res.data) && activeRoomIdRef.current === roomId) {
              setMessages(res.data);
            }
          })
          .catch(() => {});
        if (socket) {
          socket.emit("room:join", { roomId });
        }
      };

      const handleSendMessage = (e, customText = null) => {
        if (e) e.preventDefault();
        const text = (customText !== null ? customText : inputText).trim();
        if (!text || !socket) return;

        socket.emit("message:send", {
          roomId: activeRoomId,
          text,
          mediaType: "text",
          replyTo: replyingTo
            ? {
                messageId: replyingTo.id,
                text: replyingTo.text,
                senderName: replyingTo.sender?.username || "User",
              }
            : null,
        });

        setInputText("");
        setReplyingTo(null);
        setShowEmojiPicker(false);
        socket.emit("typing:stop", { roomId: activeRoomId });
      };

      const handleInputChange = (e) => {
        const val = e.target.value;
        setInputText(val);

        if (!socket) return;
        if (val.trim()) {
          socket.emit("typing:start", { roomId: activeRoomId });
          clearTimeout(typingTimeoutRef.current);
          typingTimeoutRef.current = setTimeout(() => {
            socket.emit("typing:stop", { roomId: activeRoomId });
          }, 1800);
        } else {
          socket.emit("typing:stop", { roomId: activeRoomId });
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !socket) return;

        let currentToken = token;
        if (!currentToken) {
          try {
            const authRes = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ identifier: currentUser.username || "bhavya", password: "Password123!" }),
            });
            const authData = await authRes.json();
            if (authData.success && authData.data) {
              currentToken = authData.data.tokens.accessToken;
              setToken(currentToken);
              localStorage.setItem("wa_token", currentToken);
            }
          } catch (_) {}
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            headers: currentToken ? { Authorization: `Bearer ${currentToken}` } : {},
            body: formData,
          });
          const result = await res.json();

          if (result.success && result.data) {
            socket.emit("message:send", {
              roomId: activeRoomId,
              text: file.name,
              mediaType: result.data.mediaType,
              mediaUrl: result.data.url,
              mediaName: result.data.originalName,
              mediaSize: result.data.size,
            });
          } else {
            alert(result.error || "Upload failed: file rejected");
          }
        } catch (err) {
          alert("File upload error: " + err.message);
        } finally {
          e.target.value = "";
        }
      };

      const startVoiceRecording = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            handleSendSimulatedVoiceNote();
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];

          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data.size > 0) audioChunksRef.current.push(ev.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: "audio/webm" });
            const formData = new FormData();
            formData.append("file", audioBlob, "voice_message.webm");

            try {
              const res = await fetch("/api/upload", {
                method: "POST",
                headers: token ? { Authorization: `Bearer ${token}` } : {},
                body: formData,
              });
              const result = await res.json();
              if (result.success && result.data) {
                socket.emit("message:send", {
                  roomId: activeRoomId,
                  text: `Voice note (${recordDuration}s)`,
                  mediaType: "voice",
                  mediaUrl: result.data.url,
                });
              }
            } catch (_) {
              handleSendSimulatedVoiceNote();
            }

            stream.getTracks().forEach((track) => track.stop());
            setIsRecordingVoice(false);
            setRecordDuration(0);
            clearInterval(recordTimerRef.current);
          };

          mediaRecorder.start();
          setIsRecordingVoice(true);
          setRecordDuration(0);
          recordTimerRef.current = setInterval(() => {
            setRecordDuration((prev) => prev + 1);
          }, 1000);
        } catch (err) {
          handleSendSimulatedVoiceNote();
        }
      };

      const stopVoiceRecording = () => {
        if (mediaRecorderRef.current && isRecordingVoice) {
          mediaRecorderRef.current.stop();
        }
      };

      const handleSendSimulatedVoiceNote = () => {
        if (!socket) return;
        socket.emit("message:send", {
          roomId: activeRoomId,
          text: "Voice message (0:12)",
          mediaType: "voice",
          mediaUrl: null,
        });
      };

      const handleReact = (messageId, emoji) => {
        if (!socket) return;
        socket.emit("message:react", { messageId, roomId: activeRoomId, emoji });
        setSelectedMessageForAction(null);
      };

      const handleDeleteMessage = async (messageId, deleteForEveryone) => {
        try {
          await fetch(`/api/messages/${messageId}`, {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
              ...(token ? { Authorization: `Bearer ${token}` } : {}),
            },
            body: JSON.stringify({ deleteForEveryone }),
          });
          setSelectedMessageForAction(null);
        } catch (err) {
          alert("Could not delete: " + err.message);
        }
      };

      // WebRTC Call Initiation
      const startCall = async (isVideo) => {
        try {
          setCallModal({
            type: isVideo ? "video" : "voice",
            status: "ringing",
            isCaller: true,
            roomId: activeRoomId,
          });

          const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
          });
          peerConnectionRef.current = pc;

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: isVideo,
            });
            localStreamRef.current = stream;
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
            stream.getTracks().forEach((track) => pc.addTrack(track, stream));
          } catch (_) {}

          pc.onicecandidate = (e) => {
            if (e.candidate && socket) {
              socket.emit("call:ice_candidate", {
                candidate: e.candidate,
                roomId: activeRoomId,
              });
            }
          };

          pc.ontrack = (e) => {
            if (remoteVideoRef.current && e.streams[0]) {
              remoteVideoRef.current.srcObject = e.streams[0];
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          if (socket) {
            socket.emit("call:initiate", {
              roomId: activeRoomId,
              isVideo,
              offer,
            });
          }
        } catch (err) {
          alert("Unable to initialize call: " + err.message);
          endCall(true);
        }
      };

      const acceptCall = async () => {
        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
          });
          peerConnectionRef.current = pc;

          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: callModal.type === "video",
            });
            localStreamRef.current = stream;
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
            stream.getTracks().forEach((track) => pc.addTrack(track, stream));
          } catch (_) {}

          pc.onicecandidate = (e) => {
            if (e.candidate && socket) {
              socket.emit("call:ice_candidate", {
                candidate: e.candidate,
                roomId: callModal.roomId,
              });
            }
          };

          pc.ontrack = (e) => {
            if (remoteVideoRef.current && e.streams[0]) {
              remoteVideoRef.current.srcObject = e.streams[0];
            }
          };

          if (callModal.offer) {
            await pc.setRemoteDescription(new RTCSessionDescription(callModal.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (socket) {
              socket.emit("call:answer", {
                roomId: callModal.roomId,
                answer,
              });
            }
          }

          setCallModal((prev) => ({ ...prev, status: "connected" }));
        } catch (err) {
          endCall(true);
        }
      };

      const endCall = (notifyPeers = true) => {
        if (notifyPeers && socket && callModal) {
          socket.emit("call:end", { roomId: callModal.roomId || activeRoomId });
        }
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((t) => t.stop());
        }
        if (peerConnectionRef.current) {
          peerConnectionRef.current.close();
        }
        localStreamRef.current = null;
        peerConnectionRef.current = null;
        setCallModal(null);
      };

      const handleDemoLogin = async (username) => {
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier: username, password: "Password123!" }),
          });
          const result = await res.json();
          if (result.success && result.data) {
            const u = result.data.user;
            const t = result.data.tokens.accessToken;
            setCurrentUser(u);
            setToken(t);
            localStorage.setItem("wa_user", JSON.stringify(u));
            localStorage.setItem("wa_token", t);
            setIsAuthModalOpen(false);
            setIsProfileModalOpen(false);
            window.location.reload();
          } else {
            alert(result.error || "Login failed");
          }
        } catch (err) {
          alert("Login error: " + err.message);
        }
      };

      const handleStartDirectChat = async (targetUser) => {
        try {
          let currentToken = token;
          if (!currentToken) {
            const authRes = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ identifier: currentUser.username || "bhavya", password: "Password123!" }),
            });
            const authData = await authRes.json();
            if (authData.success && authData.data) {
              currentToken = authData.data.tokens.accessToken;
              setToken(currentToken);
              localStorage.setItem("wa_token", currentToken);
            }
          }

          const res = await fetch("/api/conversations/direct", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(currentToken ? { Authorization: `Bearer ${currentToken}` } : {}),
            },
            body: JSON.stringify({ targetUserId: targetUser._id || targetUser.id }),
          });
          const result = await res.json();
          if (result.success && result.data) {
            setIsNewChatModalOpen(false);
            const directConv = {
              _id: result.data._id,
              id: result.data._id,
              name: targetUser.displayName || targetUser.username,
              avatar: targetUser.avatar,
              type: "direct",
              description: targetUser.about || targetUser.phone || "Direct message",
            };
            setRooms((prev) => [directConv, ...prev.filter((r) => (r._id || r.id) !== result.data._id)]);
            handleSwitchRoom(result.data._id);
            loadConversations();
          } else {
            alert(result.error || "Unable to start direct chat");
          }
        } catch (err) {
          alert("Error starting chat: " + err.message);
        }
      };

      const handleCreateGroup = async (e) => {
        e.preventDefault();
        const form = e.target;
        const name = form.groupName.value.trim();
        const description = form.description.value.trim();
        const checkedUsers = Array.from(form.elements)
          .filter((el) => el.name === "participant" && el.checked)
          .map((el) => el.value);

        if (!name) return;

        try {
          let currentToken = token;
          if (!currentToken) {
            const authRes = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ identifier: currentUser.username || "bhavya", password: "Password123!" }),
            });
            const authData = await authRes.json();
            if (authData.success && authData.data) {
              currentToken = authData.data.tokens.accessToken;
              setToken(currentToken);
              localStorage.setItem("wa_token", currentToken);
            }
          }

          const res = await fetch("/api/conversations/groups", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(currentToken ? { Authorization: `Bearer ${currentToken}` } : {}),
            },
            body: JSON.stringify({ name, description, participantIds: checkedUsers }),
          });
          const result = await res.json();
          if (result.success && result.data) {
            setIsNewGroupModalOpen(false);
            const newGroup = {
              _id: result.data._id,
              id: result.data._id,
              name: result.data.groupMeta?.name || name,
              avatar: result.data.groupMeta?.avatar || "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=120&h=120&q=80",
              type: "group",
              description: description || "Group conversation",
            };
            setRooms((prev) => [newGroup, ...prev.filter((r) => (r._id || r.id) !== result.data._id)]);
            handleSwitchRoom(result.data._id);
            loadConversations();
          } else {
            alert(result.error || "Group creation failed");
          }
        } catch (err) {
          alert("Error creating group: " + err.message);
        }
      };

      const handleSummarizeChat = async () => {
        try {
          const res = await fetch(`/api/ai/summarize/${activeRoomId}`);
          const result = await res.json();
          if (result.success && result.data) {
            setAiSummaryModal(result.data.summary);

          alert("Failed to summarize: " + err.message);

                        <button
                          onClick={() => handleDeleteMessage(msg.id || msg._id, isMine)}
                          className="cursor-pointer text-xs font-semibold text-red-500 hover:underline"
                        >
                          Delete
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}

              {typingUser && (
                <div className="flex items-center gap-2">
                  <div className="bg-white px-3.5 py-2 rounded-2xl rounded-tl-none border border-slate-200 shadow-xs text-xs text-[#008069] font-medium flex items-center gap-1.5">
                    <span>{typingUser} is typing</span>
                    <span className="flex gap-1">
                      <span className="w-1.5 h-1.5 bg-[#008069] rounded-full animate-bounce"></span>
                      <span className="w-1.5 h-1.5 bg-[#008069] rounded-full animate-bounce [animation-delay:0.2s]"></span>
                      <span className="w-1.5 h-1.5 bg-[#008069] rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </span>
                  </div>
                </div>
              )}

              <div ref={messagesEndRef} />
            </div>

            {/* Smart Suggestions Bar (Unit 4 AI feature) */}
            {smartSuggestions.length > 0 && (
              <div className="bg-[#f0f2f5] px-4 py-1.5 border-t border-[#e9edef] flex items-center gap-2 overflow-x-auto">
                <span className="text-[11px] text-slate-500 font-semibold shrink-0">✨ Suggestions:</span>
                {smartSuggestions.map((sug, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => handleSendMessage(null, sug)}
                    className="cursor-pointer px-3 py-1 rounded-full bg-white border border-slate-300 hover:border-[#008069] hover:text-[#008069] text-xs font-medium shrink-0 transition-all shadow-2xs"
                  >
                    {sug}
                  </button>
                ))}
              </div>
            )}

            {/* Replying banner */}
            {replyingTo && (
              <div className="bg-[#f0f2f5] px-4 py-2 border-t border-[#e9edef] flex items-center justify-between">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="w-1 h-8 bg-[#00a884] rounded"></span>
                  <div className="min-w-0">
                    <span className="text-xs font-bold text-[#008069]">
                      Replying to {replyingTo.sender?.username || "User"}
                    </span>
                    <p className="text-xs text-[#667781] truncate">{replyingTo.text}</p>
                  </div>
                </div>
                <button
                  onClick={() => setReplyingTo(null)}
                  className="cursor-pointer text-slate-400 hover:text-slate-700 text-lg font-bold"
                >
                  &times;
                </button>
              </div>
            )}

            {/* Quick Emoji Drawer */}
            {showEmojiPicker && (
              <div className="bg-[#f0f2f5] px-4 py-2 border-t border-[#e9edef] flex items-center gap-2 overflow-x-auto">
                {QUICK_EMOJIS.map((emoji) => (
                  <button
                    key={emoji}
                    type="button"
                    onClick={() => setInputText((prev) => prev + emoji)}
                    className="cursor-pointer text-xl p-1.5 hover:bg-slate-200 rounded-lg transition-transform active:scale-125"
                  >
                    {emoji}
                  </button>
                ))}
              </div>
            )}

            <input
              type="file"
              ref={fileInputRef}
              onChange={handleFileUpload}
              className="hidden"
              accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
            />

            {/* Input Form */}
            <form
              onSubmit={(e) => handleSendMessage(e)}
              className="h-16 bg-[#f0f2f5] px-4 flex items-center gap-3 border-t border-[#e9edef] shrink-0"
            >
              <button
                type="button"
                onClick={() => setShowEmojiPicker((prev) => !prev)}
                className="cursor-pointer text-[#54656f] hover:text-[#008069] transition-colors p-1"
                title="Choose Emoji"
              >
                <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </button>

              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                title="Attach Document / Photo / Video"
                className="cursor-pointer text-[#54656f] hover:text-[#008069] transition-colors p-1"
              >
                <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>

              {isRecordingVoice ? (
                <div className="flex-1 flex items-center justify-between bg-red-50 text-red-600 rounded-lg px-4 py-2 text-xs font-semibold border border-red-200 animate-pulse">
                  <span className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                    Recording Voice Note... ({recordDuration}s)
                  </span>
                  <button
                    type="button"
                    onClick={stopVoiceRecording}
                    className="cursor-pointer bg-red-600 text-white px-2.5 py-1 rounded text-xs"
                  >
                    Done &amp; Send
                  </button>
                </div>
              ) : (
                <input
                  type="text"
                  value={inputText}
                  onChange={handleInputChange}
                  placeholder={activeRoom.slug === "meta-ai" ? "Ask Meta AI anything with RAG context..." : "Type a message (or @Meta AI for assistant)"}
                  className="flex-1 bg-white rounded-lg px-4 py-2.5 text-sm text-[#111b21] placeholder-[#667781] focus:outline-none shadow-2xs"
                />
              )}

              {inputText.trim() ? (
                <button
                  type="submit"
                  title="Send Message"
                  className="cursor-pointer w-10 h-10 rounded-full bg-[#00a884] hover:bg-[#008069] text-white flex items-center justify-center transition-transform active:scale-95 shadow-md"
                >
                  <svg className="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
              ) : (
                <button
                  type="button"
                  onClick={isRecordingVoice ? stopVoiceRecording : startVoiceRecording}
                  title="Record Voice Note"
                  className={`cursor-pointer w-10 h-10 rounded-full flex items-center justify-center transition-colors ${
                    isRecordingVoice ? "bg-red-600 text-white" : "text-[#54656f] hover:text-[#008069]"
                  }`}
                >
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
              )}
            </form>
          </main>

          {/* AI SUMMARY MODAL */}
          {aiSummaryModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">✨</span>
                    <h3 className="font-bold text-lg text-[#111b21]">RAG Conversation Summary</h3>
                  </div>
                  <button onClick={() => setAiSummaryModal(null)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="my-4 p-4 rounded-xl bg-blue-50/70 border border-blue-100 text-xs text-slate-800 leading-relaxed whitespace-pre-wrap">
                  {aiSummaryModal}
                </div>
                <div className="flex justify-end">
                  <button
                    onClick={() => setAiSummaryModal(null)}
                    className="cursor-pointer px-4 py-2 bg-[#008069] text-white rounded-lg text-xs font-bold hover:bg-[#075e54]"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">WhatsApp Authentication</h3>
                  <button onClick={() => setIsAuthModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>

                <div className="mt-4 mb-4">
                  <div className="text-xs font-bold uppercase tracking-wider text-[#008069] mb-2">1-Click Fast Persona Switch:</div>
                  <div className="grid grid-cols-2 gap-2">
                    {["bhavya", "aarav", "priya", "rohan"].map((uName) => (
                      <button
                        key={uName}
                        onClick={() => handleDemoLogin(uName)}
                        className="cursor-pointer p-2.5 rounded-xl border border-slate-200 hover:border-[#008069] hover:bg-emerald-50 text-left capitalize font-semibold text-xs flex items-center gap-2 transition-all"
                      >
                        <span className="w-2 h-2 rounded-full bg-[#25d366]"></span>
                        <span>Sign in as {uName}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-200">
                  <form
                    onSubmit={async (e) => {
                      e.preventDefault();
                      const form = e.target;
                      const identifier = form.identifier.value;
                      const password = form.password.value;
                      try {
                        const res = await fetch("/api/auth/login", {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ identifier, password }),
                        });
                        const result = await res.json();
                        if (result.success && result.data) {
                          setCurrentUser(result.data.user);
                          setToken(result.data.tokens.accessToken);
                          localStorage.setItem("wa_user", JSON.stringify(result.data.user));
                          localStorage.setItem("wa_token", result.data.tokens.accessToken);
                          setIsAuthModalOpen(false);
                          window.location.reload();
                        } else {
                          alert(result.error || "Login failed");
                        }
                      } catch (err) {
                        alert(err.message);
                      }
                    }}
                    className="space-y-3"
                  >
                    <input
                      name="identifier"
                      placeholder="Username or Email"
                      required
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                    />
                    <input
                      type="password"
                      name="password"
                      placeholder="Password"
                      required
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                    />
                    <button
                      type="submit"
                      className="w-full bg-[#008069] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#075e54] transition-colors"
                    >
                      Authenticate with JWT
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* NEW DIRECT CHAT MODAL */}
          {isNewChatModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Start New 1-on-1 Chat</h3>
                  <button onClick={() => setIsNewChatModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <p className="text-xs text-[#667781] my-3">Select a contact to open persistent private messaging:</p>
                <div className="space-y-2 max-h-72 overflow-y-auto">
                  {registeredUsers
                    .filter((u) => u.username !== currentUser.username && u.rawUsername !== currentUser.username)
                    .map((user) => (
                      <div
                        key={user._id || user.id}
                        onClick={() => handleStartDirectChat(user)}
                        className="cursor-pointer flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 hover:border-[#008069] hover:bg-emerald-50 transition-all"
                      >
                        <img src={user.avatar} alt={user.username} className="w-10 h-10 rounded-full object-cover" />
                        <div className="flex-1 min-w-0">
                          <div className="text-xs font-bold text-[#111b21]">{user.displayName || user.username}</div>
                          <div className="text-[11px] text-[#667781] truncate">{user.about || user.phone}</div>
                        </div>
                        <span className="text-xs font-bold text-[#008069]">Message</span>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* CREATE GROUP MODAL */}
          {isNewGroupModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Create New Group</h3>
                  <button onClick={() => setIsNewGroupModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <form onSubmit={handleCreateGroup} className="mt-4 space-y-3">
                  <input
                    name="groupName"
                    placeholder="Group Subject / Name"
                    required
                    className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                  />
                  <input
                    name="description"
                    placeholder="Group Description (Optional)"
                    className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                  />
                  <div className="text-xs font-semibold text-[#111b21] mt-2">Select Members:</div>
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {registeredUsers
                      .filter((u) => u.username !== currentUser.username)
                      .map((u) => (
                        <label
                          key={u._id || u.id}
                          className="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 border border-slate-100 text-xs cursor-pointer"
                        >
                          <input type="checkbox" name="participant" value={u._id || u.id} className="accent-[#008069]" />
                          <img src={u.avatar} alt={u.username} className="w-6 h-6 rounded-full" />
                          <span className="font-medium text-[#111b21]">{u.displayName || u.username}</span>
                        </label>
                      ))}
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-[#008069] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#075e54] transition-colors mt-3"
                  >
                    Create Group
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* GROUP INFO MODAL */}
          {isGroupInfoModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">{activeRoom.name}</h3>
                  <button onClick={() => setIsGroupInfoModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="flex flex-col items-center py-4 border-b border-slate-200">
                  <img src={activeRoom.avatar} alt={activeRoom.name} className="w-20 h-20 rounded-full object-cover shadow-xs mb-2" />
                  <p className="text-xs text-slate-600 text-center max-w-xs">{activeRoom.description || "No description provided."}</p>
                </div>
                <div className="mt-3">
                  <div className="text-xs font-bold uppercase tracking-wider text-[#667781] mb-2">Members ({onlineUsers.length})</div>
                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {onlineUsers.map((u) => (
                      <div key={u.id || u.socketId} className="flex items-center justify-between text-xs p-2 rounded-lg bg-slate-50">
                        <div className="flex items-center gap-2">
                          <img src={u.avatar} alt={u.username} className="w-7 h-7 rounded-full" />
                          <span className="font-semibold text-[#111b21]">{u.username}</span>
                        </div>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">Active</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PROFILE MODAL */}
          {isProfileModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Your Profile</h3>
                  <button onClick={() => setIsProfileModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="flex flex-col items-center py-4">
                  <img src={currentUser.avatar} alt={currentUser.username} className="w-24 h-24 rounded-full object-cover border-4 border-[#00a884] shadow-md mb-2" />
                  <div className="text-base font-bold text-[#111b21]">{currentUser.displayName || currentUser.username}</div>
                  <div className="text-xs text-[#667781]">{currentUser.email}</div>
                  <div className="text-xs text-[#008069] mt-1 font-semibold">{currentUser.about}</div>
                </div>
                <div className="space-y-2 pt-2 border-t border-slate-200">
                  <button
                    onClick={() => {
                      localStorage.clear();
                      window.location.reload();
                    }}
                    className="cursor-pointer w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-xs font-bold transition-colors"
                  >
                    Logout &amp; Clear Storage
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CALL MODAL (WebRTC) */}
          {callModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#111b21] text-white rounded-3xl w-full max-w-md p-6 text-center shadow-2xl flex flex-col items-center gap-4 relative">
                {callModal.type === "video" ? (
                  <div className="w-full h-64 bg-slate-900 rounded-2xl overflow-hidden relative border border-slate-800">
                    <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    <video ref={localVideoRef} autoPlay playsInline muted className="w-24 h-32 object-cover rounded-xl border-2 border-[#00a884] absolute bottom-2 right-2 bg-black" />
                  </div>
                ) : (
                  <img src={activeRoom.avatar} alt={activeRoom.name} className="w-24 h-24 rounded-full border-4 border-[#00a884] shadow-lg animate-pulse my-4" />
                )}

                <div>
                  <h3 className="text-xl font-bold">{activeRoom.name}</h3>
                  <p className="text-xs text-slate-400 mt-1 capitalize">
                    {callModal.status === "connected" ? "Connected (WebRTC P2P)" : `${callModal.type} call ${callModal.status}...`}
                  </p>
                </div>

                <div className="flex items-center gap-4 mt-3">
                  {callModal.status === "incoming" ? (
                    <>
                      <button
                        onClick={acceptCall}
                        className="cursor-pointer w-12 h-12 rounded-full bg-[#25d366] hover:bg-[#00a884] flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="Accept Call"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                      </button>
                      <button
                        onClick={() => endCall(true)}
                        className="cursor-pointer w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="Decline"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.78 7.39 7 12 7c4.61 0 8.72 1.78 11.71 4.67.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                      </button>
                    </>
                  ) : (
                    <>
                      <button
                        onClick={() => {
                          if (localStreamRef.current) {
                            localStreamRef.current.getAudioTracks().forEach((t) => (t.enabled = !t.enabled));
                            setIsMicMuted((prev) => !prev);
                          }
                        }}
                        className={`cursor-pointer w-10 h-10 rounded-full flex items-center justify-center ${isMicMuted ? "bg-red-500" : "bg-slate-700"}`}
                        title="Mute Mic"
                      >
                        🎤
                      </button>
                      <button
                        onClick={() => endCall(true)}
                        className="cursor-pointer w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="End Call"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.78 7.39 7 12 7c4.61 0 8.72 1.78 11.71 4.67.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                      </button>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<WhatsAppApp />);
  </script>
</body>
</html>
