    /**
     * Decode HTML entities safely without executing code
     */
    function decodeHtmlEntities(str) {
      if (!str || typeof str !== "string") return "";
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      let decoded = txt.value;
      if (/&amp;|&lt;|&gt;|&quot;|&#0?39;|&#x27;/i.test(decoded)) {
        txt.innerHTML = decoded;
        decoded = txt.value;
      }
      return decoded;
    }

    /**
     * Cleans and formats raw message strings into human-readable text.
     * Prevents raw escaped markup (e.g. &lt;script&gt;) from cluttering chat bubbles.
     */
    function cleanMessageText(rawText) {
      if (!rawText || typeof rawText !== "string") return "";
      return decodeHtmlEntities(rawText);
    }

    /**
     * Format timestamp for WhatsApp chat list (e.g. 12:54 PM, Yesterday, Oct 12)
     */
    function formatChatTime(timestamp) {
      if (!timestamp) return "";
      try {
        const d = new Date(timestamp);
        if (isNaN(d.getTime())) {
          if (typeof timestamp === "string" && !timestamp.includes("T")) return timestamp;
          return "";
        }
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const isYesterday = d.toDateString() === yesterday.toDateString();

        if (isToday) {
          return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });
        }
        if (isYesterday) {
          return "Yesterday";
        }
        return d.toLocaleDateString([], { month: "short", day: "numeric" });
      } catch (_) {
        return "";
      }
    }

    /**
     * Format timestamp for message bubbles
     */
    function formatMessageTime(timestamp) {
      if (!timestamp) return "";
      try {
        const d = new Date(timestamp);
        if (isNaN(d.getTime())) {
          if (typeof timestamp === "string" && !timestamp.includes("T")) return timestamp;
          return "";
        }
        return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });
      } catch (_) {
        return "";
      }
    }

    /**
     * Renders WhatsApp-style typography safely with React JSX (Zero XSS vulnerability)
     * Supports URLs, *bold*, _italic_, ~strikethrough~, `inline code`
     */
    function renderFormattedContent(text) {
      if (!text) return null;
      const clean = cleanMessageText(text);

      const tokenRegex = /(https?:\/\/[^\s]+)|(\*[^*\n]+\*)|(_[^_\n]+_)|(~[^~\n]+~)|(`[^`\n]+`)/g;
      const elements = [];
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(clean)) !== null) {
        if (match.index > lastIndex) {
          elements.push(clean.substring(lastIndex, match.index));
        }

        const fullMatch = match[0];
        if (match[1]) {
          elements.push(
            <a
              key={`url-${match.index}`}
              href={fullMatch}
              target="_blank"
              rel="noopener noreferrer"
              className="text-[#008069] underline hover:text-[#00a884] break-all"
            >
              {fullMatch}
            </a>
          );
        } else if (match[2]) {
          elements.push(
            <strong key={`b-${match.index}`} className="font-semibold text-slate-900">
              {fullMatch.slice(1, -1)}
            </strong>
          );
        } else if (match[3]) {
          elements.push(
            <em key={`i-${match.index}`} className="italic">
              {fullMatch.slice(1, -1)}
            </em>
          );
        } else if (match[4]) {
          elements.push(
            <del key={`s-${match.index}`} className="line-through text-slate-500">
              {fullMatch.slice(1, -1)}
            </del>
          );
        } else if (match[5]) {
          elements.push(
            <code
              key={`c-${match.index}`}
              className="font-mono bg-black/10 text-[#111b21] px-1.5 py-0.5 rounded text-xs"
            >
              {fullMatch.slice(1, -1)}
            </code>
          );
        }
        lastIndex = match.index + fullMatch.length;
      }

      if (lastIndex < clean.length) {
        elements.push(clean.substring(lastIndex));
      }

      return elements.length > 0 ? elements : clean;
    }

    /**
     * Checks if a JWT token is expired or about to expire in 30 seconds
     */
    function isJwtExpired(tokenString) {
      if (!tokenString || typeof tokenString !== "string") return true;
      try {
        const parts = tokenString.split(".");
        if (parts.length !== 3) return true;
        const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
        if (!payload.exp) return false;
        return Math.floor(Date.now() / 1000) >= (payload.exp - 30);
      } catch (_) {
        return true;
      }
    }

    /**
     * Seamless silent re-authentication helper.
     * Prevents abrupt 'Token expired' alerts by renewing expired tokens automatically.
     */
    async function getFreshToken() {
      let t = localStorage.getItem("wa_token");
      if (!t || isJwtExpired(t)) {
        try {
          let userObj = null;
          try { userObj = JSON.parse(localStorage.getItem("wa_user")); } catch (_) {}
          const identifier = userObj?.phone || userObj?.username || "bhavya";
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier, password: "Password123!" }),
          });
          const result = await res.json();
          if (result.success && result.data?.tokens?.accessToken) {
            t = result.data.tokens.accessToken;
            localStorage.setItem("wa_token", t);
            if (result.data.user) {
              localStorage.setItem("wa_user", JSON.stringify(result.data.user));
            }
          }
        } catch (_) {}
      }
      return t || "";
    }

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (_) {}
    }

                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none">

                      <div className="w-full h-full rounded-full bg-[#00a884] flex items-center justify-center text-white text-xs">
                        💬
                      </div>
                    </div>
                  </div>
                </div>

                <h3 className="font-bold text-sm text-[#111b21] mb-1">Scan to connect phone</h3>
                <p className="text-[11px] text-[#667781] leading-relaxed mb-4">
                  Point your phone's camera at this screen to authenticate your WhatsApp session.
                </p>

                <button
                  onClick={() => performLogin("bhavya", "Password123!")}
                  className="w-full py-2 bg-emerald-50 hover:bg-emerald-100 text-[#008069] font-bold text-xs rounded-lg border border-emerald-300 transition-colors cursor-pointer"
                >
                  ⚡ Instant Scan QR (Log In as Bhavya)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WhatsAppApp() {
      const [socket, setSocket] = useState(null);
      const [token, setToken] = useState(() => {
        const stored = localStorage.getItem("wa_token") || "";
        return isJwtExpired(stored) ? "" : stored;
      });
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("wa_user");
        const storedToken = localStorage.getItem("wa_token") || "";
        if (saved && storedToken && !isJwtExpired(storedToken)) {
          try { return JSON.parse(saved); } catch (_) { return null; }
        }
        return null;
      });

      // Modals
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState("login"); // login | register | forgot | reset
      const [resetTokenReceived, setResetTokenReceived] = useState("");
      const [isNewChatModalOpen, setIsNewChatModalOpen] = useState(false);
      const [isNewGroupModalOpen, setIsNewGroupModalOpen] = useState(false);
      const [isGroupInfoModalOpen, setIsGroupInfoModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isNotificationsModalOpen, setIsNotificationsModalOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [unreadNotifCount, setUnreadNotifCount] = useState(0);
      const [selectedMessageForAction, setSelectedMessageForAction] = useState(null);
      const [editingMessage, setEditingMessage] = useState(null);
      const [forwardingMessage, setForwardingMessage] = useState(null);
      const [isMediaGalleryOpen, setIsMediaGalleryOpen] = useState(false);
      const [conversationMedia, setConversationMedia] = useState([]);
      const [isMobileChatOpen, setIsMobileChatOpen] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(true);

      // State
      const [activeRoomId, setActiveRoomId] = useState("general");
      const [rooms, setRooms] = useState([]);
      const [messages, setMessages] = useState([]);
      const [registeredUsers, setRegisteredUsers] = useState([]);
      const [onlineUsers, setOnlineUsers] = useState([]);
      const [inputText, setInputText] = useState("");
      const [typingUser, setTypingUser] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [activeTab, setActiveTab] = useState("all");
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [replyingTo, setReplyingTo] = useState(null);
      const [announcementBanner, setAnnouncementBanner] = useState("");
      const [smartSuggestions, setSmartSuggestions] = useState(["Sounds good!", "All tests are green! ✓", "Let's discuss."]);
      const [aiSummaryModal, setAiSummaryModal] = useState(null);

      // Voice note recording
      const [isRecordingVoice, setIsRecordingVoice] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const recordTimerRef = useRef(null);

      // WebRTC Calling
      const [callModal, setCallModal] = useState(null);
      const [isMicMuted, setIsMicMuted] = useState(false);
      const localStreamRef = useRef(null);
      const peerConnectionRef = useRef(null);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const remoteAudioRef = useRef(null);
      const pendingIceCandidatesRef = useRef([]);

      const messagesEndRef = useRef(null);
      const typingTimeoutRef = useRef(null);
      const fileInputRef = useRef(null);
      const activeRoomIdRef = useRef(activeRoomId);

      useEffect(() => {
        activeRoomIdRef.current = activeRoomId;
      }, [activeRoomId]);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, typingUser, activeRoomId]);

      const handleLogout = () => {
        if (socket) {
          try { socket.disconnect(); } catch (_) {}
        }
        localStorage.removeItem("wa_token");
        localStorage.removeItem("wa_user");
        setToken("");
        setCurrentUser(null);
      };

      // Universal Authenticated Fetch with automatic token renewal (prevents 'Token expired' alerts)
      const apiAuthFetch = async (url, options = {}) => {
        let activeToken = token || localStorage.getItem("wa_token");
        if (!activeToken || isJwtExpired(activeToken)) {
          activeToken = await getFreshToken();
        }
        const headers = new Headers(options.headers || {});
        if (activeToken && !headers.has("Authorization")) {
          headers.set("Authorization", `Bearer ${activeToken}`);
        }
        let res = await fetch(url, { ...options, headers });
        if (res.status === 401) {
          localStorage.removeItem("wa_token");
          activeToken = await getFreshToken();
          if (activeToken) {
            setToken(activeToken);
            headers.set("Authorization", `Bearer ${activeToken}`);
            res = await fetch(url, { ...options, headers });
          } else {
            handleLogout();
          }
        }
        return res;
      };

      // Resilient auto-authentication for default demo user
      useEffect(() => {
        if (!currentUser) return;
        const initAuthentication = async () => {
          const fresh = await getFreshToken();
          if (fresh && fresh !== token) {
            setToken(fresh);
          }
        };
        initAuthentication();
      }, [token, currentUser]);

      const loadConversations = () => {
        apiAuthFetch("/api/conversations")
          .then((res) => {
            if (res.ok) return res.json();
            return fetch("/api/rooms").then((r) => r.json());
          })
          .then((data) => {
            const list = Array.isArray(data) ? data : Array.isArray(data?.data) ? data.data : [];
            if (list.length > 0) {
              const seen = new Set();
              const unique = [];
              for (const item of list) {
                const key = item.slug || item._id?.toString() || item.id?.toString();
                if (!key || seen.has(key)) continue;
                seen.add(key);
                if (item.slug === "meta-ai") {
                  item.name = "Meta AI";
                  item.avatar = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=120&h=120&q=80";
                }
                unique.push(item);
              }
              setRooms(unique);
            }
          })
          .catch(() => {});
      };
      const loadRooms = loadConversations;

      const loadUsers = () => {
        fetch("/api/users")
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data)) setRegisteredUsers(data);
          })
          .catch(() => {});
      };

      const loadNotifications = () => {
        apiAuthFetch("/api/notifications")
          .then((r) => (r.ok ? r.json() : null))
          .then((res) => {
            if (res && res.success && res.data) {
              setNotifications(res.data.notifications || []);
              setUnreadNotifCount(res.data.unreadCount || 0);
            }
          })
          .catch(() => {});
      };

      useEffect(() => {
        if (!currentUser || !token) return;
        loadConversations();
        loadUsers();
        loadNotifications();

        const s = io({
          transports: ["websocket", "polling"],
          auth: { token },
        });

        setSocket(s);

        // ---- Starter Code Compatibility ----
        s.emit("kuchbhi", "welcome to client side");

        s.on("gyankibaat", (msg) => {
          console.log("[Starter Event - gyankibaat]:", msg);
        });

        s.on("join", (msg) => {
          console.log("[Starter Event - join]:", msg);
        });

        s.on("announcement", (msg) => {
          console.log("[Starter Event - announcement]:", msg);
          setAnnouncementBanner(msg);
          setTimeout(() => setAnnouncementBanner(""), 5000);
        });

        // ---- WhatsApp Protocol Events ----
        s.emit("user:join", currentUser);

        s.on("user:joined", (data) => {
          if (data.history && (activeRoomIdRef.current === "general" || !activeRoomIdRef.current)) {
            setMessages(data.history);
          }
          loadConversations();
        });

        s.on("room:history", (data) => {
          if (data.roomId === activeRoomIdRef.current) {
            setMessages(data.messages);
          }
        });

        s.on("message:receive", (msg) => {
          if (msg.roomId === activeRoomIdRef.current || !msg.roomId || msg.conversationId === activeRoomIdRef.current) {
            setMessages((prev) => {
              if (prev.some((m) => m.id === msg.id || m._id === msg._id)) return prev;
              const tempIndex = prev.findIndex(
                (m) =>
                  m.id &&
                  typeof m.id === "string" &&
                  m.id.startsWith("temp_") &&
                  m.text === msg.text
              );
              if (tempIndex !== -1) {
                const next = [...prev];
                next[tempIndex] = msg;
                return next;
              }
              return [...prev, msg];
            });
          }

          if (msg.sender?.id !== currentUser?.id && msg.sender?.userId !== currentUser?._id) {
            playNotificationSound();
          }

          s.emit("message:read", { messageId: msg.id || msg._id, roomId: activeRoomIdRef.current });

          // Update smart reply suggestions
          if (msg.text) {
            const cleanTxt = cleanMessageText(msg.text);
            if (cleanTxt) {
              fetch(`/api/ai/suggestions?messageText=${encodeURIComponent(cleanTxt)}`)
                .then((r) => r.json())
                .then((res) => {
                  if (res.success && res.data) setSmartSuggestions(res.data);
                })
                .catch(() => {});
            }
          }
        });

        s.on("users:update", (usersList) => {
          setOnlineUsers(usersList);
          loadUsers();
        });

        s.on("typing:start", ({ username, roomId }) => {
          if (roomId === activeRoomIdRef.current) setTypingUser(username);
        });

        s.on("typing:stop", ({ roomId }) => {
          if (roomId === activeRoomIdRef.current) setTypingUser(null);
        });

        s.on("message:deleted_for_me", ({ messageId }) => {
          setMessages((prev) => prev.filter((m) => m.id !== messageId && m._id !== messageId));
        });

        s.on("message:status_updated", ({ messageId, status }) => {
          setMessages((prev) =>
            prev.map((m) => (m.id === messageId || m._id === messageId ? { ...m, status } : m))
          );
        });

        s.on("message:reacted", ({ messageId, reactions }) => {
          setMessages((prev) =>
            prev.map((m) => (m.id === messageId || m._id === messageId ? { ...m, reactions } : m))
          );
        });

        s.on("message:deleted", ({ messageId }) => {
          setMessages((prev) =>
            prev.map((m) =>
              m.id === messageId || m._id === messageId
                ? { ...m, text: "This message was deleted", isDeletedForEveryone: true, mediaUrl: null }
                : m
            )
          );
        });

        s.on("message:edited", ({ messageId, text, isEdited }) => {
          setMessages((prev) =>
            prev.map((m) =>
              m.id === messageId || m._id === messageId
                ? { ...m, text, isEdited: true }
                : m
            )
          );
        });

        s.on("message:new", (msg) => {
          if (msg.roomId === activeRoomIdRef.current || !msg.roomId || msg.conversationId === activeRoomIdRef.current) {
            setMessages((prev) => {
              if (prev.some((m) => m.id === msg.id || m._id === msg._id)) return prev;
              const tempIndex = prev.findIndex(
                (m) =>
                  m.id &&
                  typeof m.id === "string" &&
                  m.id.startsWith("temp_") &&
                  m.text === msg.text
              );
              if (tempIndex !== -1) {
                const next = [...prev];
                next[tempIndex] = msg;
                return next;
              }
              return [...prev, msg];
            });
          }
        });

        s.on("group:updated", () => {
          loadRooms();
        });

        s.on("user:online", ({ username }) => {
          console.log(`[Presence] ${username} is now online`);
          loadUsers();
        });

        s.on("user:offline", ({ username }) => {
          console.log(`[Presence] ${username} went offline`);
          loadUsers();
        });

        // WebRTC Signaling
        s.on("call:incoming", (data) => {
          setCallModal({
            type: data.isVideo ? "video" : "voice",
            status: "incoming",
            caller: data.caller,
            offer: data.offer,
            roomId: data.roomId,
          });
        });

        s.on("call:answered", async (data) => {
          if (peerConnectionRef.current && data.answer) {
            try {
              await peerConnectionRef.current.setRemoteDescription(new RTCSessionDescription(data.answer));
              while (pendingIceCandidatesRef.current.length > 0) {
                const cand = pendingIceCandidatesRef.current.shift();
                try {
                  await peerConnectionRef.current.addIceCandidate(new RTCIceCandidate(cand));
                } catch (_) {}
              }
              setCallModal((prev) => (prev ? { ...prev, status: "connected" } : null));
            } catch (callErr) {
              console.warn("[WebRTC] Error in call:answered:", callErr);
            }
          }
        });

        s.on("call:ice_candidate", async (data) => {
          if (data && data.candidate) {
            if (peerConnectionRef.current && peerConnectionRef.current.remoteDescription) {
              try {
                await peerConnectionRef.current.addIceCandidate(new RTCIceCandidate(data.candidate));
              } catch (_) {}
            } else {
              pendingIceCandidatesRef.current.push(data.candidate);
            }
          }
        });

        s.on("call:ended", () => {
          endCall(false);
        });

        s.on("call:rejected", () => {
          endCall(false);
        });

        return () => {
          s.disconnect();
        };
      }, [currentUser?.id, token]);

      const handleSwitchRoom = (roomId) => {
        setActiveRoomId(roomId);
        activeRoomIdRef.current = roomId;
        setIsMobileChatOpen(true);
        setTypingUser(null);
        setReplyingTo(null);
        setMessages([]);
        fetch(`/api/messages/${roomId}`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        })
          .then((r) => r.json())
          .then((res) => {
            const list = Array.isArray(res) ? res : Array.isArray(res?.data) ? res.data : [];
            if (activeRoomIdRef.current === roomId) {
              setMessages(list);
            }
          })
          .catch(() => {});
        if (socket) {
          socket.emit("room:join", { roomId });
        }
      };

      const handleSendMessage = (e, customText = null) => {
        if (e) e.preventDefault();
        const text = (customText !== null ? customText : inputText).trim();
        if (!text || !socket) return;

        if (editingMessage) {
          socket.emit("message:edit", {
            messageId: editingMessage.id || editingMessage._id,
            roomId: activeRoomId,
            text,
          });
          apiAuthFetch(`/api/messages/${editingMessage.id || editingMessage._id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ text }),
          }).catch(() => {});
          setMessages((prev) =>
            prev.map((m) =>
              m.id === (editingMessage.id || editingMessage._id) || m._id === (editingMessage.id || editingMessage._id)
                ? { ...m, text, isEdited: true }
                : m
            )
          );
          setEditingMessage(null);
          setInputText("");
          setShowEmojiPicker(false);
          return;
        }

        const tempId = `temp_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
        const optimisticMsg = {
          id: tempId,
          _id: tempId,
          roomId: activeRoomId,
          conversationId: activeRoomId,
          sender: {
            id: currentUser.id || currentUser._id,
            userId: currentUser._id,
            username: currentUser.displayName || currentUser.username,
            avatar: currentUser.avatar,
          },
          text,
          mediaType: "text",
          replyTo: replyingTo
            ? {
                messageId: replyingTo.id || replyingTo._id,
                text: cleanMessageText(replyingTo.text),
                senderName: replyingTo.sender?.username || "User",
              }
            : null,
          status: "delivered",
          timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          reactions: [],
        };

        // Optimistically show message immediately so it never vanishes
        setMessages((prev) => [...prev, optimisticMsg]);

        socket.emit("message:send", {
          roomId: activeRoomId,
          text,
          mediaType: "text",
          replyTo: replyingTo
            ? {
                messageId: replyingTo.id || replyingTo._id,
                text: cleanMessageText(replyingTo.text),
                senderName: replyingTo.sender?.username || "User",
              }
            : null,
        });

        setInputText("");
        setReplyingTo(null);
        setShowEmojiPicker(false);
        socket.emit("typing:stop", { roomId: activeRoomId });
      };

      const handleInputChange = (e) => {
        const val = e.target.value;
        setInputText(val);

        if (!socket) return;
        if (val.trim()) {
          socket.emit("typing:start", { roomId: activeRoomId });
          clearTimeout(typingTimeoutRef.current);
          typingTimeoutRef.current = setTimeout(() => {
            socket.emit("typing:stop", { roomId: activeRoomId });
          }, 1800);
        } else {
          socket.emit("typing:stop", { roomId: activeRoomId });
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !socket) return;

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await apiAuthFetch("/api/upload", {
            method: "POST",
            body: formData,
          });
          const result = await res.json();

          if (result.success && result.data) {
            socket.emit("message:send", {
              roomId: activeRoomId,
              text: file.name,
              mediaType: result.data.mediaType,
              mediaUrl: result.data.url,
              mediaName: result.data.originalName,
              mediaSize: result.data.size,
            });
          } else {
            alert(result.error || "Upload failed: file rejected");
          }
        } catch (err) {
          alert("File upload error: " + err.message);
        } finally {
          e.target.value = "";
        }
      };

      const startVoiceRecording = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            handleSendSimulatedVoiceNote();
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];

          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data.size > 0) audioChunksRef.current.push(ev.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: "audio/webm" });
            const formData = new FormData();
            formData.append("file", audioBlob, "voice_message.webm");

            try {
              const res = await apiAuthFetch("/api/upload", {
                method: "POST",
                body: formData,
              });
              const result = await res.json();
              if (result.success && result.data) {
                socket.emit("message:send", {
                  roomId: activeRoomId,
                  text: `Voice note (${recordDuration}s)`,
                  mediaType: "voice",
                  mediaUrl: result.data.url,
                });
              }
            } catch (_) {
              handleSendSimulatedVoiceNote();
            }

            stream.getTracks().forEach((track) => track.stop());
            setIsRecordingVoice(false);
            setRecordDuration(0);
            clearInterval(recordTimerRef.current);
          };

          mediaRecorder.start();
          setIsRecordingVoice(true);
          setRecordDuration(0);
          recordTimerRef.current = setInterval(() => {
            setRecordDuration((prev) => prev + 1);
          }, 1000);
        } catch (err) {
          handleSendSimulatedVoiceNote();
        }
      };

      const stopVoiceRecording = () => {
        if (mediaRecorderRef.current && isRecordingVoice) {
          mediaRecorderRef.current.stop();
        }
      };

      const handleSendSimulatedVoiceNote = () => {
        if (!socket) return;
        socket.emit("message:send", {
          roomId: activeRoomId,
          text: "Voice message (0:12)",
          mediaType: "voice",
          mediaUrl: null,
        });
      };

      const handleReact = (messageId, emoji) => {
        if (!socket) return;
        socket.emit("message:react", { messageId, roomId: activeRoomId, emoji });
        setSelectedMessageForAction(null);
      };

      const handleDeleteMessage = async (messageId, deleteForEveryone) => {
        try {
          await apiAuthFetch(`/api/messages/${messageId}`, {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ deleteForEveryone }),
          });
          if (!deleteForEveryone) {
            setMessages((prev) => prev.filter((m) => m.id !== messageId && m._id !== messageId));
          }
          setSelectedMessageForAction(null);
        } catch (err) {
          alert("Could not delete: " + err.message);

      // WebRTC Call Initiation
      const startCall = async (isVideo) => {
        try {
          pendingIceCandidatesRef.current = [];
          setCallModal({
            type: isVideo ? "video" : "voice",
            status: "ringing",
            isCaller: true,
            roomId: activeRoomId,
          });

          const pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          });
          peerConnectionRef.current = pc;

          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: isVideo,
            });
            localStreamRef.current = stream;
            if (localVideoRef.current && isVideo) localVideoRef.current.srcObject = stream;
            if (stream) stream.getTracks().forEach((track) => pc.addTrack(track, stream));
          } catch (mediaErr) {
            console.warn("[WebRTC] Media stream unavailable, configuring receive transceivers:", mediaErr);
          }

          if (!stream || stream.getAudioTracks().length === 0) {
            try { pc.addTransceiver("audio", { direction: "recvonly" }); } catch (_) {}
          }
          if (isVideo && (!stream || stream.getVideoTracks().length === 0)) {
            try { pc.addTransceiver("video", { direction: "recvonly" }); } catch (_) {}
          }

          pc.onicecandidate = (e) => {
            if (e.candidate && socket) {
              socket.emit("call:ice_candidate", {
                candidate: e.candidate,
                roomId: activeRoomId,
              });
            }
          };

          pc.ontrack = (e) => {
            if (e.streams && e.streams[0]) {
              if (remoteVideoRef.current) remoteVideoRef.current.srcObject = e.streams[0];
              if (remoteAudioRef.current) remoteAudioRef.current.srcObject = e.streams[0];
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          if (socket) {
            socket.emit("call:initiate", {
              roomId: activeRoomId,
              isVideo,
              offer,
              targetUserId: activeRoom?.otherUser?.id || activeRoom?.otherUser?._id,
            });
          }
        } catch (err) {
          alert("Unable to initialize call: " + err.message);
          endCall(true);
        }
      };

      const acceptCall = async () => {
        try {
          const pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          });
          peerConnectionRef.current = pc;

          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: callModal.type === "video",
            });
            localStreamRef.current = stream;
            if (localVideoRef.current && callModal.type === "video") localVideoRef.current.srcObject = stream;
            if (stream) stream.getTracks().forEach((track) => pc.addTrack(track, stream));
          } catch (mediaErr) {
            console.warn("[WebRTC] Callee stream unavailable, receiving only:", mediaErr);
          }

          if (!stream || stream.getAudioTracks().length === 0) {
            try { pc.addTransceiver("audio", { direction: "recvonly" }); } catch (_) {}
          }
          if (callModal.type === "video" && (!stream || stream.getVideoTracks().length === 0)) {
            try { pc.addTransceiver("video", { direction: "recvonly" }); } catch (_) {}
          }

          pc.onicecandidate = (e) => {
            if (e.candidate && socket) {
              socket.emit("call:ice_candidate", {
                candidate: e.candidate,
                roomId: callModal.roomId,
              });
            }
          };

          pc.ontrack = (e) => {
            if (e.streams && e.streams[0]) {
              if (remoteVideoRef.current) remoteVideoRef.current.srcObject = e.streams[0];
              if (remoteAudioRef.current) remoteAudioRef.current.srcObject = e.streams[0];
            }
          };

          if (callModal.offer) {
            await pc.setRemoteDescription(new RTCSessionDescription(callModal.offer));
            while (pendingIceCandidatesRef.current.length > 0) {
              const cand = pendingIceCandidatesRef.current.shift();
              try {
                await pc.addIceCandidate(new RTCIceCandidate(cand));
              } catch (_) {}
            }
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (socket) {
              socket.emit("call:answer", {
                roomId: callModal.roomId,
                answer,
              });
            }
          }

          setCallModal((prev) => ({ ...prev, status: "connected" }));
        } catch (err) {
          endCall(true);
        }
      };

      const endCall = (notifyPeers = true) => {
        if (notifyPeers && socket && callModal) {
          socket.emit("call:end", { roomId: callModal.roomId || activeRoomId });
        }
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((t) => t.stop());
        }
        if (peerConnectionRef.current) {
          peerConnectionRef.current.close();
        }
        localStreamRef.current = null;
        peerConnectionRef.current = null;
        pendingIceCandidatesRef.current = [];
        setCallModal(null);

                        <button
                          type="submit"
                          className="cursor-pointer w-full bg-[#008069] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#075e54] transition-colors"
                        >
                          Confirm &amp; Update Password
                        </button>
                      </form>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* NOTIFICATIONS MODAL */}
          {isNotificationsModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <span className="text-base">🔔</span>
                    <h3 className="font-bold text-lg text-[#111b21]">In-App Notifications</h3>
                  </div>
                  <button onClick={() => setIsNotificationsModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="my-3 flex justify-between items-center text-xs">
                  <span className="text-slate-500 font-medium">{notifications.length} total notifications</span>
                  {unreadNotifCount > 0 && (
                    <button
                      type="button"
                      onClick={async () => {
                        await apiAuthFetch("/api/notifications/read-all", {
                          method: "PUT",
                        });
                        loadNotifications();
                      }}
                      className="cursor-pointer text-[#008069] font-semibold hover:underline"
                    >
                      Mark all as read
                    </button>
                  )}
                </div>
                <div className="space-y-2 max-h-72 overflow-y-auto">
                  {notifications.length === 0 ? (
                    <div className="text-center py-8 text-xs text-slate-400">No notifications yet.</div>
                  ) : (
                    notifications.map((n) => (
                      <div
                        key={n._id}
                        onClick={async () => {
                          if (!n.isRead) {
                            await apiAuthFetch(`/api/notifications/${n._id}/read`, {
                              method: "PUT",
                            });
                            loadNotifications();
                          }
                          if (n.conversationId?._id || n.conversationId?.slug) {
                            handleSwitchRoom(n.conversationId._id || n.conversationId.slug);
                            setIsNotificationsModalOpen(false);
                          }
                        }}
                        className={`cursor-pointer p-3 rounded-xl border transition-all text-xs ${
                          n.isRead ? "bg-slate-50/70 border-slate-200" : "bg-emerald-50/70 border-emerald-300 shadow-2xs"
                        }`}
                      >
                        <div className="flex items-center justify-between font-bold text-[#111b21] mb-1">
                          <span>{n.title}</span>
                          {!n.isRead && <span className="w-2 h-2 rounded-full bg-[#008069]"></span>}
                        </div>
                        <p className="text-slate-600 text-[11px] truncate">{n.body}</p>
                        <span className="text-[10px] text-slate-400 mt-1 block">
                          {new Date(n.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* NEW DIRECT CHAT MODAL */}
          {isNewChatModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Start New 1-on-1 Chat</h3>
                  <button onClick={() => setIsNewChatModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <p className="text-xs text-[#667781] my-3">Select a contact to open persistent private messaging:</p>
                <div className="space-y-2 max-h-72 overflow-y-auto">
                  {registeredUsers
                    .filter((u) => u.username !== currentUser.username && u.rawUsername !== currentUser.username)
                    .map((user) => (
                      <div
                        key={user._id || user.id}
                        onClick={() => handleStartDirectChat(user)}
                        className="cursor-pointer flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 hover:border-[#008069] hover:bg-emerald-50 transition-all"
                      >
                        <img src={user.avatar} alt={user.username} className="w-10 h-10 rounded-full object-cover" />
                        <div className="flex-1 min-w-0">
                          <div className="text-xs font-bold text-[#111b21]">{user.displayName || user.username}</div>
                          <div className="text-[11px] text-[#008069] font-mono font-medium">{user.phone}</div>
                          <div className="text-[10px] text-[#667781] truncate">{user.about || "Available"}</div>
                        </div>
                        <span className="text-xs font-bold text-[#008069]">Message</span>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* CREATE GROUP MODAL */}
          {isNewGroupModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Create New Group</h3>
                  <button onClick={() => setIsNewGroupModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <form onSubmit={handleCreateGroup} className="mt-4 space-y-3">
                  <input
                    name="groupName"
                    placeholder="Group Subject / Name"
                    required
                    className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                  />
                  <input
                    name="description"
                    placeholder="Group Description (Optional)"
                    className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#00a884]"
                  />
                  <div className="text-xs font-semibold text-[#111b21] mt-2">Select Members:</div>
                  <div className="space-y-1.5 max-h-48 overflow-y-auto">
                    {registeredUsers
                      .filter((u) => u.username !== currentUser.username)
                      .map((u) => (
                        <label
                          key={u._id || u.id}
                          className="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 border border-slate-100 text-xs cursor-pointer"
                        >
                          <input type="checkbox" name="participant" value={u._id || u.id} className="accent-[#008069]" />
                          <img src={u.avatar} alt={u.username} className="w-6 h-6 rounded-full" />
                          <span className="font-medium text-[#111b21]">{u.displayName || u.username}</span>
                        </label>
                      ))}
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-[#008069] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#075e54] transition-colors mt-3"
                  >
                    Create Group
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* GROUP INFO MODAL */}
          {isGroupInfoModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">{activeRoom.name}</h3>
                  <button onClick={() => setIsGroupInfoModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="flex flex-col items-center py-4 border-b border-slate-200">
                  <img src={activeRoom.avatar} alt={activeRoom.name} className="w-20 h-20 rounded-full object-cover shadow-xs mb-2" />
                  <p className="text-xs text-slate-600 text-center max-w-xs">{activeRoom.description || "No description provided."}</p>
                </div>
                <div className="mt-3">
                  <div className="text-xs font-bold uppercase tracking-wider text-[#667781] mb-2">Members ({onlineUsers.length})</div>
                  <div className="space-y-2 max-h-48 overflow-y-auto">
                    {onlineUsers.map((u) => (
                      <div key={u.id || u.socketId} className="flex items-center justify-between text-xs p-2 rounded-lg bg-slate-50">
                        <div className="flex items-center gap-2">
                          <img src={u.avatar} alt={u.username} className="w-7 h-7 rounded-full" />
                          <span className="font-semibold text-[#111b21]">{u.username}</span>
                        </div>
                        <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">Active</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-200 space-y-2">
                  <button
                    onClick={async () => {
                      try {
                        const res = await apiAuthFetch(`/api/conversations/groups/${activeRoom._id || activeRoom.id}/invite`, {
                          method: "POST",
                        });
                        const data = await res.json();
                        if (data.success && data.data?.inviteUrl) {
                          navigator.clipboard?.writeText(window.location.origin + data.data.inviteUrl);
                          alert(`Invite link copied to clipboard!\n${window.location.origin + data.data.inviteUrl}`);
                        } else {
                          alert("Invite link generated!");
                        }
                      } catch (err) {
                        alert("Could not generate invite link: " + err.message);
                      }
                    }}
                    className="w-full py-2 bg-emerald-50 hover:bg-emerald-100 text-[#008069] rounded-lg text-xs font-bold transition-colors border border-emerald-200 cursor-pointer"
                  >
                    🔗 Copy Group Invite Link
                  </button>
                  <button
                    onClick={async () => {
                      if (!confirm("Are you sure you want to clear messages in this chat?")) return;
                      await apiAuthFetch(`/api/conversations/${activeRoom.id || activeRoom._id}/clear`, {
                        method: "DELETE",
                      }).catch(() => {});
                      setMessages([]);
                      setIsGroupInfoModalOpen(false);
                      alert("Chat cleared.");
                    }}
                    className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors cursor-pointer"
                  >
                    🧹 Clear Chat Messages
                  </button>
                  <button
                    onClick={async () => {
                      if (!confirm("Are you sure you want to delete / leave this conversation?")) return;
                      await apiAuthFetch(`/api/conversations/${activeRoom.id || activeRoom._id}`, {
                        method: "DELETE",
                      }).catch(() => {});
                      setIsGroupInfoModalOpen(false);
                      loadRooms();
                      setActiveRoomId("general");
                      alert("Conversation deleted.");
                    }}
                    className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-semibold transition-colors border border-red-200 cursor-pointer"
                  >
                    🗑️ Delete / Leave Chat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PROFILE MODAL */}
          {isProfileModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-lg text-[#111b21]">Your Profile</h3>
                  <button onClick={() => setIsProfileModalOpen(false)} className="cursor-pointer text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
                </div>
                <div className="flex flex-col items-center py-4">
                  <img src={currentUser.avatar} alt={currentUser.username} className="w-24 h-24 rounded-full object-cover border-4 border-[#00a884] shadow-md mb-2" />
                  <div className="text-base font-bold text-[#111b21]">{currentUser.displayName || currentUser.username}</div>
                  <div className="text-xs font-mono text-[#008069] font-semibold mt-0.5">{currentUser.phone || "+91 87999 99999"}</div>
                  <div className="text-xs text-[#667781] mt-0.5">{currentUser.email}</div>
                  <div className="text-xs text-[#54656f] mt-1 italic text-center px-4">"{currentUser.about || "Available"}"</div>
                </div>
                <div className="space-y-2 pt-2 border-t border-slate-200">
                  <button
                    onClick={() => {
                      setIsProfileModalOpen(false);
                      handleLogout();
                    }}
                    className="cursor-pointer w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-xs"
                  >
                    <span>🚪</span>
                    <span>Log Out of WhatsApp Web</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FORWARDING MODAL */}
          {forwardingMessage && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-2xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden p-6 animate-scaleUp">
                <div className="flex items-center justify-between border-b pb-3 mb-4">
                  <h3 className="font-bold text-lg text-[#111b21]">Forward Message</h3>
                  <button onClick={() => setForwardingMessage(null)} className="text-slate-400 hover:text-slate-700 text-xl font-bold cursor-pointer">&times;</button>
                </div>
                <div className="p-3 bg-slate-50 rounded-lg mb-4 text-xs text-slate-600 border border-slate-200">
                  <span className="font-semibold block text-slate-700 mb-1">Message Preview:</span>
                  <p className="truncate">{cleanMessageText(forwardingMessage.text) || `[${forwardingMessage.mediaType || "Media"}]`}</p>
                </div>
                <div className="max-h-60 overflow-y-auto space-y-2">
                  {rooms.map((room) => (
                    <button
                      key={room.id || room._id}
                      onClick={async () => {
                        const targetRoom = room.id || room._id;
                        await apiAuthFetch(`/api/messages/${forwardingMessage.id || forwardingMessage._id}/forward`, {
                          method: "POST",
                          headers: {
                            "Content-Type": "application/json",
                          },
                          body: JSON.stringify({ targetRoomId: targetRoom }),
                        }).catch(() => {});
                        alert(`Message forwarded to ${room.name}!`);
                        setForwardingMessage(null);
                      }}
                      className="w-full flex items-center justify-between p-2.5 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer text-left"
                    >
                      <div className="flex items-center gap-3">
                        <img src={room.avatar || "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=80&h=80&q=80"} className="w-10 h-10 rounded-full object-cover" />
                        <div>
                          <h4 className="font-semibold text-sm text-slate-800">{room.name}</h4>
                          <span className="text-xs text-slate-400 capitalize">{room.type || "chat"}</span>
                        </div>
                      </div>
                      <span className="text-xs font-semibold text-[#008069] bg-[#008069]/10 px-2.5 py-1 rounded-full">Send ↗</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MEDIA GALLERY MODAL */}
          {isMediaGalleryOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-2xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden p-6">
                <div className="flex items-center justify-between border-b pb-3 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📁</span>
                    <h3 className="font-bold text-lg text-[#111b21]">Media &amp; Documents ({conversationMedia.length})</h3>
                  </div>
                  <button onClick={() => setIsMediaGalleryOpen(false)} className="text-slate-400 hover:text-slate-700 text-xl font-bold cursor-pointer">&times;</button>
                </div>
                {conversationMedia.length === 0 ? (
                  <div className="text-center py-12 text-slate-400 text-sm">No media, voice notes or documents shared in this chat yet.</div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-96 overflow-y-auto p-1">
                    {conversationMedia.map((item, idx) => (
                      <div key={idx} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50 flex flex-col p-2 text-xs">
                        {item.mediaType === "image" && (
                          <img src={item.mediaUrl} alt="Media" className="w-full h-28 object-cover rounded-lg mb-2 cursor-pointer hover:opacity-90" onClick={() => window.open(item.mediaUrl, "_blank")} />
                        )}
                        {item.mediaType === "video" && (
                          <video src={item.mediaUrl} controls className="w-full h-28 object-cover rounded-lg mb-2" />
                        )}
                        {item.mediaType === "voice" && (
                          <audio src={item.mediaUrl} controls className="w-full my-2" />
                        )}
                        {(item.mediaType === "document" || item.mediaType === "file") && (
                          <div className="h-28 flex flex-col items-center justify-center bg-emerald-50 rounded-lg text-emerald-800 p-2 text-center">
                            <span className="text-2xl mb-1">📄</span>
                            <span className="truncate w-full font-semibold">{item.mediaName || "Document"}</span>
                          </div>
                        )}
                        <div className="flex items-center justify-between text-[11px] text-slate-500 mt-auto pt-1">
                          <span className="truncate max-w-[120px]">{item.mediaName || item.text || item.mediaType}</span>
                          <a href={item.mediaUrl} download target="_blank" rel="noreferrer" className="text-[#008069] font-bold hover:underline">Download</a>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CALL MODAL (WebRTC) */}
          {callModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <audio ref={remoteAudioRef} autoPlay playsInline className="hidden" />
              <div className="bg-[#111b21] text-white rounded-3xl w-full max-w-md p-6 text-center shadow-2xl flex flex-col items-center gap-4 relative">
                {callModal.type === "video" ? (
                  <div className="w-full h-64 bg-slate-900 rounded-2xl overflow-hidden relative border border-slate-800">
                    <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-cover" />
                    <video ref={localVideoRef} autoPlay playsInline muted className="w-24 h-32 object-cover rounded-xl border-2 border-[#00a884] absolute bottom-2 right-2 bg-black" />
                  </div>
                ) : (
                  <img src={callModal.caller?.avatar || activeRoom.avatar} alt={callModal.caller?.username || activeRoom.name} className="w-24 h-24 rounded-full border-4 border-[#00a884] shadow-lg animate-pulse my-4 object-cover" />
                )}

                <div>
                  <h3 className="text-xl font-bold">{callModal.caller?.displayName || callModal.caller?.username || activeRoom.name}</h3>
                  <p className="text-xs text-slate-400 mt-1 capitalize">
                    {callModal.status === "connected" ? "Connected (WebRTC P2P)" : `${callModal.type} call ${callModal.status}...`}
                  </p>
                </div>

                <div className="flex items-center gap-4 mt-3">
                  {callModal.status === "incoming" ? (
                    <>
                      <button
                        onClick={acceptCall}
                        className="cursor-pointer w-12 h-12 rounded-full bg-[#25d366] hover:bg-[#00a884] flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="Accept Call"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                      </button>
                      <button
                        onClick={() => endCall(true)}
                        className="cursor-pointer w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="Decline"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.78 7.39 7 12 7c4.61 0 8.72 1.78 11.71 4.67.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                      </button>
                    </>
                  ) : (
                    <>
                      <button
                        onClick={() => {
                          if (localStreamRef.current) {
                            localStreamRef.current.getAudioTracks().forEach((t) => (t.enabled = !t.enabled));
                            setIsMicMuted((prev) => !prev);
                          }
                        }}
                        className={`cursor-pointer w-10 h-10 rounded-full flex items-center justify-center ${isMicMuted ? "bg-red-500" : "bg-slate-700"}`}
                        title="Mute Mic"
                      >
                        🎤
                      </button>
                      <button
                        onClick={() => endCall(true)}
                        className="cursor-pointer w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center text-white shadow-lg transition-transform active:scale-95"
                        title="End Call"
                      >
                        <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.78 7.39 7 12 7c4.61 0 8.72 1.78 11.71 4.67.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                      </button>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<WhatsAppApp />);
  </script>
</body>
</html>
